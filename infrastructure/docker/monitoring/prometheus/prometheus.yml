# M11: exporters are reachable only inside the monitoring bridge.
global:
  scrape_interval: 30s
  scrape_timeout: 15s
  evaluation_interval: 30s
rule_files:
  - alert-rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [mon-node-exporter:9100]
        labels:
          instance: studentencloud-vm
  - job_name: mysqld
    static_configs:
      - targets: [mon-mysqld-exporter:9104]
        labels:
          instance: nc-db
  - job_name: blackbox
    static_configs:
      - targets: [mon-blackbox:9115]
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [nextcloud-https]
    static_configs:
      - targets: [https://host.docker.internal/status.php]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: studentencloud-https
      - target_label: __address__
        replacement: mon-blackbox:9115
