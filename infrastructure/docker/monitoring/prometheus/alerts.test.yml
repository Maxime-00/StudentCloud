  "tests": [
    {
      "name": "HTTPS outage",
      "interval": "30s",
      "input_series": [
        {
          "series": "up{job=\"prometheus\",instance=\"localhost:9090\"}",
          "values": "1+0x4000"
        },
        {
          "series": "up{job=\"node\",instance=\"studentencloud-vm\"}",
          "values": "1+0x4000"
        },
        {
          "series": "up{job=\"mysqld\",instance=\"nc-db\"}",
          "values": "1+0x4000"
        },
        {
          "series": "up{job=\"blackbox\",instance=\"mon-blackbox:9115\"}",
          "values": "1+0x4000"
        },
        {
          "series": "up{job=\"blackbox-https\",instance=\"studentencloud-https\"}",
          "values": "1+0x4000"
        },
        {
          "series": "probe_success{job=\"blackbox-https\",instance=\"studentencloud-https\"}",
          "values": "0+0x4000"
        },
        {
          "series": "mysql_up{job=\"mysqld\",instance=\"nc-db\"}",
          "values": "1+0x4000"
        },
        {
          "series": "node_filesystem_size_bytes{job=\"node\",mountpoint=\"/\"}",
          "values": "1000+0x4000"
        },
        {
          "series": "node_filesystem_avail_bytes{job=\"node\",mountpoint=\"/\"}",
          "values": "500+0x4000"
        },
        {
          "series": "node_filesystem_size_bytes{job=\"node\",mountpoint=\"/srv/nextcloud-data\"}",
          "values": "1000+0x4000"
        },
        {
          "series": "node_filesystem_avail_bytes{job=\"node\",mountpoint=\"/srv/nextcloud-data\"}",
          "values": "500+0x4000"
        },
        {
          "series": "studentcloud_container_healthy{container=\"nc-app\"}",
          "values": "1+0x4000"
        },
        {
          "series": "studentcloud_collector_timestamp_seconds",
          "values": "0+30x4000"
        },
        {
          "series": "studentcloud_nextcloud_log_readable",
          "values": "1+0x4000"
        },
        {
          "series": "studentcloud_nextcloud_recent_errors",
          "values": "0+0x4000"
        },
        {
          "series": "probe_ssl_earliest_cert_expiry{job=\"blackbox-https\"}",
          "values": "5184000+0x4000"
        },
        {
          "series": "backup_last_success_timestamp_seconds",
          "values": "0+30x4000"
        },
        {
          "series": "backup_check_timestamp_seconds",
          "values": "0+30x4000"
        },
        {
          "series": "studentcloud_nextcloud_log_invalid_lines",
          "values": "0+0x4000"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "count(ALERTS{alertname=\"NextcloudOnbereikbaar\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "7m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        }
      ]
    },
