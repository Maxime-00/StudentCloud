services:
  db:
    image: mariadb:11.8
    container_name: nc-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nc-internal

  redis:
    image: redis:7-alpine
    container_name: nc-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nc-internal

  # Both app and cron use this scanner via the internal Docker network.
  clamav:
    image: clamav/clamav:1.4_base
    container_name: nc-clamav
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - nc-internal

  app:
    image: nextcloud:35-apache
    container_name: nc-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}

      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-2G}
      APACHE_BODY_LIMIT: ${APACHE_BODY_LIMIT:-2147483648}

    volumes:
      - nc-html:/var/www/html
      - /srv/nextcloud-data/data:/var/www/html/data

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - nc-internal

  cron:
    image: nextcloud:35-apache
    container_name: nc-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nc-html:/var/www/html
      - /srv/nextcloud-data/data:/var/www/html/data
    depends_on:
      - app
    networks:
      - nc-internal

  # ── M11 — Monitoring ─────────────────────────────────────────────────
  # node_exporter + blackbox: host networking (host metrics + 127.0.0.1:443 probe)
  # mysqld_exporter: nc-internal netwerk (reach nc-db via container-naam)
  # prometheus: nc-internal + extra_hosts voor host.docker.internal
  # Prometheus-UI: http://127.0.0.1:9090 (alleen lokaal op de VM)

  mon-node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: mon-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /etc/node_exporter/textfile_collector:/etc/node_exporter/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.textfile.directory=/etc/node_exporter/textfile_collector"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    labels:
      com.dabbi.docker.nonessential: "true"

  mon-blackbox:
    image: prom/blackbox-exporter:v0.26.0
    container_name: mon-blackbox
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./monitoring/blackbox.yml:/config/blackbox.yml:ro
    command:
      - "--config.file=/config/blackbox.yml"
    labels:
      com.dabbi.docker.nonessential: "true"

  mon-mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mon-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${DB_USER}:${DB_PASSWORD}@db:3306/"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nc-internal
    labels:
      com.dabbi.docker.nonessential: "true"

  mon-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mon-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - mon-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mon-mysqld-exporter
    networks:
      - nc-internal
    labels:
      com.dabbi.docker.nonessential: "true"

volumes:
  db-data:
  nc-html:
  clamav-signatures:
  mon-prometheus-data:

networks:
  nc-internal:
    driver: bridge
