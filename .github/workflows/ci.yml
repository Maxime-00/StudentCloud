name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Compose using example values
        run: >-
          docker compose
          --env-file infrastructure/docker/.env.example
          -f infrastructure/docker/docker-compose.yml
          config --quiet

  nginx:
    name: Nginx configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate throwaway test certificate
        # De live 443-config vermeldt /etc/nginx/ssl/*. Deze tijdelijke (throwaway)
        # self-signed pair bestaat alleen zodat `nginx -t` de bestanden kan laden.
        # Ze wordt nergens gedeeld en niet ge-commit.
        run: |
          mkdir -p "${RUNNER_TEMP}/nginx-ssl"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${RUNNER_TEMP}/nginx-ssl/studentencloud.key" \
            -out "${RUNNER_TEMP}/nginx-ssl/studentencloud.crt" \
            -days 1 \
            -subj "/CN=studentencloud" \
            -addext "subjectAltName=DNS:studentencloud"
      - name: Validate Nginx syntax in an isolated container
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/infrastructure/nginx/studentencloud.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/nginx-ssl,target=/etc/nginx/ssl,readonly" \
            nginx:1.28.0-alpine nginx -t

  documentation:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check local Markdown links
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --workdir /repo \
            lycheeverse/lychee:0.24.2 \
            --offline --no-progress './**/*.md'

  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject committed local environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.env\.(example|sample|template)$'; then
            echo '::error::Local .env files must not be committed. Keep only example templates in Git.'
            exit 1
          fi
      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --no-banner
